<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#014A43" />
  <title>You're offline · AAICBI</title>
  <style>
    :root { color-scheme: light dark; --bg: #14181A; --fg: #E8F0ED; --muted: #A0A7AB; --teal: #4FBBA8; --on: #14181A; }
    @media (prefers-color-scheme: light) { :root { --bg: #F6F4EE; --fg: #16302B; --muted: #4B5563; --teal: #016B61; --on: #FFFFFF; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 22rem; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.25rem; }
    button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: var(--teal); color: var(--on); font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="64" height="64" />
    <h1>You're offline</h1>
    <p>We can't reach AAICBI right now. Check your connection and try again. Anything you were typing on a page you had open is still there.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
