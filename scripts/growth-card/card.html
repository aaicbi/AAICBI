<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Play card</title>
<style>
@font-face{font-family:"Fraunces";font-weight:500 700;src:url(fonts/fraunces.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400 800;src:url(fonts/manrope.woff2) format("woff2")}
:root{--s1:#06322d;--s2:#0a4a41;--s3:#0e5f53;--gold:#f2b84b;--gold2:#d99a34;--white:#f4fbf7;--ink:#0c241f}
*{box-sizing:border-box}html,body{margin:0;background:#06322d}
.card{position:relative;overflow:hidden;color:var(--white);background:radial-gradient(70% 90% at 88% -10%,var(--s3),transparent 65%),linear-gradient(160deg,var(--s1),var(--s2));isolation:isolate;font-family:Manrope,system-ui,sans-serif}
.card.land{width:1200px;height:630px}.card.sq{width:1080px;height:1080px}
.dots{position:absolute;inset:0;z-index:0;opacity:.28;background-image:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2px);background-size:28px 28px}
/* soft beams of light sweeping across */
.beam{position:absolute;top:-40%;left:50%;width:34%;height:190%;z-index:1;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,236,170,.34),rgba(255,236,170,0) 78%);filter:blur(18px);mix-blend-mode:screen;opacity:0}
.b1{animation:sweep 6s ease-in-out infinite}.b2{width:22%;animation:sweep 6s ease-in-out -2s infinite;animation-direction:reverse}.b3{width:16%;animation:sweep 6s ease-in-out -4s infinite}
@keyframes sweep{0%{transform:rotate(-38deg);opacity:0}20%{opacity:.9}50%{transform:rotate(8deg);opacity:.55}80%{opacity:.9}100%{transform:rotate(38deg);opacity:0}}
/* a warm glow that breathes behind the logo */
.halo{position:absolute;z-index:1;left:-8%;top:-20%;width:70%;height:110%;background:radial-gradient(closest-side,rgba(242,184,75,.38),rgba(242,184,75,0));animation:breathe 3s ease-in-out infinite}
.sq .halo{left:-20%;top:-10%;width:100%;height:70%}
@keyframes breathe{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.08);opacity:1}}
.sp{position:absolute;z-index:2;width:12px;height:12px;border-radius:50%;background:#fff3c4;box-shadow:0 0 14px 5px rgba(255,226,140,.9);opacity:0;animation:twinkle 3s ease-in-out infinite}
.s1{left:8%;top:18%}.s2{left:46%;top:10%;animation-delay:-.8s}.s3{left:90%;top:30%;animation-delay:-1.6s}.s4{left:60%;top:84%;animation-delay:-2.2s}.s5{left:24%;top:88%;animation-delay:-1.1s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.inner{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:space-between;padding:56px 72px;gap:40px}
.sq .inner{flex-direction:column;justify-content:center;text-align:center;padding:70px 60px;gap:46px}
.left{display:flex;flex-direction:column;gap:20px;align-items:flex-start}.sq .left{align-items:center}
.logo{width:150px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}.sq .logo{width:190px}
.kick{margin:0;font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#ffcf66}
h2{white-space:nowrap;margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:74px;line-height:1.05;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.4)}
.sq h2{font-size:104px}
.sub{margin:0;font-weight:800;font-size:27px;color:#fff}
.cta{display:inline-flex;align-items:center;gap:14px;background:var(--gold);color:var(--ink);font-weight:800;font-size:32px;border-radius:999px;padding:16px 38px;box-shadow:0 7px 0 var(--gold2),0 0 0 0 rgba(242,184,75,.7);animation:pulse 2s ease-in-out infinite}
.cta b{font-size:26px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 7px 0 var(--gold2),0 0 0 0 rgba(242,184,75,.65)}50%{transform:scale(1.06);box-shadow:0 7px 0 var(--gold2),0 0 38px 14px rgba(242,184,75,.45)}}
.right{display:flex;flex-direction:column;align-items:center;gap:30px}
.ring{position:relative;width:300px;height:300px;filter:drop-shadow(0 0 22px rgba(242,184,75,.45))}.sq .ring{width:340px;height:340px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:rgba(6,50,45,.8);stroke:rgba(255,255,255,.18);stroke-width:9}
.arc{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.7;animation:drain 6s linear infinite}
@keyframes drain{0%{stroke-dashoffset:0;stroke:var(--gold)}72%{stroke-dashoffset:235;stroke:var(--gold)}73%{stroke:#ff7a85}100%{stroke-dashoffset:326;stroke:#ff7a85}}
.num{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:120px;color:#fff}
.chips{display:flex;gap:10px;flex-wrap:nowrap}
.chips span{white-space:nowrap;background:rgba(242,184,75,.16);border:2px solid var(--gold);color:#fff;font-weight:800;font-size:21px;border-radius:999px;padding:8px 16px}
.sq .chips span{font-size:26px;padding:10px 22px}
</style></head><body>
<div class="card" id="card">
  <div class="dots"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="halo"></div>
  <i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i><i class="sp s4"></i><i class="sp s5"></i>
  <div class="inner">
    <div class="left">
      <!--LOGO-->
      <p class="kick">Africa's AI Capacity Building Initiative</p>
      <h2>Can you beat<br>the clock?</h2>
      <p class="sub">5 questions &middot; 90 seconds &middot; free, no sign-up</p>
      <div class="cta"><span>Tap to play</span><b>&#9654;</b></div>
    </div>
    <div class="right">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="arc"/></svg><div class="num" id="num">18</div></div>
      <div class="chips"><span>Learn it.</span><span>Build it.</span><span>Prove it.</span></div>
    </div>
  </div>
</div>
<script>
// Freezes every animation at an exact moment, so frames can be captured one by one and loop perfectly (all loops divide 6 seconds).
window.setTime = (ms) => {
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = ms; });
  const e = (ms % 6000) / 6000;
  document.getElementById('num').textContent = Math.max(0, Math.ceil(18 * (1 - e)));
};
</script></body></html>
